name: Build ElytraToggle 26.2

on:
  push:
    branches: [ "mc-26.2" ]
  pull_request:
    branches: [ "mc-26.2" ]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Java 25
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "25"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "9.5.1"

      - name: Build mod
        run: gradle build --no-daemon

      - name: Upload Minecraft 26.2 mod JAR
        uses: actions/upload-artifact@v4
        with:
          name: ElytraToggle-26.2
          path: |
            build/libs/ElytraToggle-26.2-*.jar
            !build/libs/*-sources.jar
            !build/libs/*-dev.jar
          if-no-files-found: error
